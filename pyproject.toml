[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "aider-mcp-server"
version = "0.1.0"
description = "Aider MCP Server - Offload AI coding tasks to Aider"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
[[project.authors]]
name = "Aider Team"

[project.license]
text = "MIT"

[project.scripts]
mcp-aider-server = "aider_mcp_server:main"
mcp-aider = "aider_mcp_server:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
skip = [ "src/aider_mcp_server/stubs/sse_starlette.pyi",]

[tool.mypy]
python_version = "3.12"
packages = [ "aider_mcp_server",]
package_root = [ "src",]
namespace_packages = true
explicit_package_bases = true
plugins = [ "pydantic.mypy",]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server.stdio"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.types"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aider.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sse_starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aider_mcp_server.server"
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.app"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.multi_transport_server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.atoms.utils.safety_configuration"
disable_error_code = "no-any-return"

[[tool.mypy.overrides]]
module = "aider_mcp_server.molecules.configuration.configuration_manager"
disable_error_code = "no-any-return"

[tool.ruff.lint]
select = [ "E", "F", "A", "B", "C", "Q", "S",]
ignore = [ "E501",]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert statements in test files
    "S105",  # Allow hardcoded passwords in test files
    "S106",  # Allow hardcoded passwords in arguments in test files
    "S108",  # Allow temp file/directory usage in test files
    "S608",  # Allow SQL injection patterns in test files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = "test_*.py"
pythonpath = [ "src",]
asyncio_default_fixture_loop_scope = "function"
markers = [ "api: marks tests that require API keys", "integration: marks tests that perform integration testing",]

[tool.pixi.project]
channels = [ "conda-forge",]
platforms = [ "linux-64"]

[tool.pixi.dependencies]
# CORE RUNTIME (minimal for CI stability)
fastapi = ">=0.115.0"
httpx = ">=0.27.0"
mcp = ">=1.9.1"
pyjwt = ">=2.8.0"
python = ">=3.12"
python-dotenv = ">=1.0.0"
sse-starlette = ">=2.0.0"
starlette = ">=0.38.0"
toml = ">=0.10.2"
uvicorn = "*"
pytest = ">=8.4.1,<9"
pytest-asyncio = ">=1.0.0,<2"
pytest-mock = ">=3.10.0"
aider-chat = ">=0.85.1,<0.86"
requests = ">=2.32.4,<3"
pre-commit = ">=4.2.0,<5"
types-toml = "*"

# TIER 1: Essential Quality Gates
[tool.pixi.feature.quality.dependencies]
mypy = ">=1.15.0"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.10.0"
pytest-timeout = ">=2.1.0"
pytest-xdist = ">=3.3.0"
ruff = ">=0.11.6"
types-pyyaml = "*"
types-toml = "*"

# TIER 2: Extended Quality & Security
[tool.pixi.feature.quality-extended.dependencies]
bandit = ">=1.7.0"
safety = ">=3.0.0"
radon = ">=6.0.0"
vulture = ">=2.9.0"
pre-commit = ">=3.0.0"

# TIER 3: Build & CI Tools
[tool.pixi.feature.build.dependencies]
cyclonedx-python-lib = ">=3.0.0"
hatchling = ">=1.18.0"
pip-audit = ">=2.6.0"
pytest-json-report = ">=1.5.0"
python-build = "*"
spdx-tools = ">=0.8.0"

# TIER 4: Aider Dependencies - MINIMAL FOR TESTING ONLY
[tool.pixi.feature.aider-deps.dependencies]
# Aider-chat is now available in conda-forge as of version 0.85.1
aider-chat = ">=0.85.1"

# Legacy packages (may cause conflicts)
[tool.pixi.feature.legacy.dependencies]
cyclonedx-python-lib = ">=3.0.0"
flake8 = "*"
git = "*"
isort = "*"
mccabe = "*"
mkdocs = "*"
pre-commit-hooks = "*"
pycodestyle = "*"
pyflakes = "*"
pytest-benchmark = "*"
spdx-tools = ">=0.8.0"
types-pyyaml = "*"

[tool.pixi.environments]
# Basic runtime environment
default = {solve-group = "default"}

# Quality gate environments (tiered approach)
quality = {features = ["quality"], solve-group = "default"}
quality-extended = {features = ["quality", "quality-extended", "build"], solve-group = "default"}
quality-full = {features = ["quality", "quality-extended", "build"], solve-group = "default"}

# Development environment (includes aider dependencies)
dev = {features = ["quality", "quality-extended", "build", "aider-deps"], solve-group = "default"}

# CI environment (quality + aider minimal deps for testing)
ci = {features = ["quality", "build", "aider-deps"], solve-group = "default"}

# Full environment (everything - use only when needed)
full = {features = ["quality", "quality-extended", "build", "aider-deps", "legacy"], solve-group = "default"}

[tool.pixi.tasks]
# ===== TIER 1: CORE DEVELOPMENT TASKS (ESSENTIAL) =====
install-editable = "pip install -e ."

# Testing (ZERO-TOLERANCE QUALITY GATES) - with Claude Code git bypass
test = { cmd = "python -m pytest tests/ -v", env = { CLAUDECODE = "0" } }
test-cov = { cmd = "python -m pytest tests/ --cov=src/aider_mcp_server --cov-report=term-missing --cov-report=xml", env = { CLAUDECODE = "0" } }
test-unit = { cmd = "python -m pytest tests/atoms/ tests/molecules/ -v", env = { CLAUDECODE = "0" } }
test-integration = { cmd = "python -m pytest tests/organisms/ -v", env = { CLAUDECODE = "0" } }

# Quality Gates (CRITICAL - MUST PASS)
lint = "ruff check src/ tests/ --select=F,E9"
lint-fix = "ruff check --fix src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/"

# Combined Quality Check
quality = { depends-on = ["test", "lint", "typecheck"] }

# ===== TIER 2: CI-OPTIMIZED TASKS =====
# CI-specific variants (use ci environment)
# CI-specific variants (use ci environment) - with Claude Code git bypass
ci-test = { cmd = "python -m pytest tests/ --tb=short -v", env = { CLAUDECODE = "0" }, cwd = ".", depends-on = ["install-editable"] }
ci-lint = "ruff check src/ tests/ --output-format=github"
ci-format-check = "ruff format --check src/ tests/"

# ===== TIER 3: SECURITY & COMPLIANCE TASKS =====
security-scan = "bandit -r src/ --severity-level high"
safety-check = "safety check"
complexity-check = "radon cc src/ --min B"
dead-code-check = "vulture src/ --min-confidence 80"

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan", "safety-check", "complexity-check", "dead-code-check"] }

# Comprehensive Check
check-all = { depends-on = ["quality", "static-analysis"] }

# ===== TIER 4: BUILD & DEPLOYMENT TASKS =====
build = "python -m build"
clean = "rm -rf __pycache__ .pytest_cache .coverage htmlcov .ruff_cache dist build"

# Pre-commit Integration - with Claude Code git bypass
pre-commit = { cmd = "pre-commit run --all-files", env = { CLAUDECODE = "0", PRE_COMMIT = "1" } }
install-pre-commit = { cmd = "pre-commit install --install-hooks", env = { CLAUDECODE = "0" } }

# ===== AIDER-SPECIFIC TASKS =====
install-aider = "echo 'aider-chat available via conda environment'"
mcp-server = { cmd = "python -m aider_mcp_server", env = { PYTHONPATH = "src" } }

# Legacy task compatibility - with Claude Code git bypass
test-legacy = { cmd = "python -m pytest tests/ -x", env = { CLAUDECODE = "0" }, depends-on = ["install-editable"] }
test-cov-legacy = { cmd = "python -m pytest --cov=src/aider_mcp_server --cov-report=term-missing --cov-report=xml tests/ -x", env = { CLAUDECODE = "0" }, depends-on = ["install-editable"] }

# [tool.pixi.pypi-dependencies]
# oslex = "*"  # Removed to avoid aider dependency conflicts

[tool.pixi.pypi-dependencies.aider-mcp-server]
path = "."
editable = true
