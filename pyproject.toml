[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aider-mcp-server"
version = "0.1.0"
description = "Aider MCP Server - Offload AI coding tasks to Aider"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Aider Team"}
]
dependencies = [
    # Minimal dependencies for pip/setuptools compatibility - pixi manages actual deps
]

[project.scripts]
mcp-aider-server = "aider_mcp_server:main"
mcp-aider = "aider_mcp_server:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "api: marks tests that require API keys",
    "integration: marks tests that perform integration testing",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "A", "B", "C", "Q", "S"] # Removed "I" for isort
ignore = ["E501"] # Ignore line length
# Ignore S101 (assert usage) in test files and exclude stubbed file from formatting
# Allow S108 (/tmp usage) in test files
# Define file-specific rule ignores
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
"test_*.py" = ["S101", "S105", "S106", "S108", "S608"]
"src/aider_mcp_server/stubs/sse_starlette.pyi" = ["E", "F", "I", "A", "B", "C", "Q", "S"]
"src/aider_mcp_server/atoms/tools/aider_ai_code.py" = ["C901"]
"src/aider_mcp_server/atoms/tools/changes_summarizer.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# Skip formatting long imports to avoid conflicts with isort
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 120
skip = ["src/aider_mcp_server/stubs/sse_starlette.pyi"]

[tool.mypy]
python_version = "3.12"
packages = ["aider_mcp_server"]
package_root = ["src"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false # Allow untyped decorators by default
ignore_missing_imports = true # Ignore missing imports by default

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server.stdio"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "mcp.types"
ignore_missing_imports = true

# External dependencies - ignore missing imports for all of these
[[tool.mypy.overrides]]
module = "aider.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sse_starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

# Internal modules with special configuration
[[tool.mypy.overrides]]
module = "aider_mcp_server.server"
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.app"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.multi_transport_server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.atoms.utils.safety_configuration"
disable_error_code = "no-any-return"

[[tool.mypy.overrides]]
module = "aider_mcp_server.molecules.configuration.configuration_manager"
disable_error_code = "no-any-return"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
# Essential runtime and development dependencies from conda-forge
python = ">=3.12"
fastapi = ">=0.115.0"
mcp = ">=1.9.1"
pydantic = ">=2.11.2"
psutil = ">=5.9.0"
pyjwt = ">=2.8.0"
python-dotenv = ">=1.0.0"
rich = ">=14.0.0"
sse-starlette = ">=2.0.0"
starlette = ">=0.38.0"
uvicorn = ">=0.30.0"
httpx = ">=0.27.0"
packaging = ">=21.3"
toml = ">=0.10.2"
pillow = ">=11.3.0"
git = "*"
# Build system
hatchling = ">=1.18.0"
python-build = "*"
# Development tools from conda-forge
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.10.0"
pytest-benchmark = "*"
pytest-timeout = "*"
pytest-xdist = "*"
pytest-json-report = ">=1.5.0"
isort = "*"
mkdocs = "*"
mypy = ">=1.15.0"
pre-commit = "*"
pre-commit-hooks = "*"
safety = ">=3.0.0"
bandit = ">=1.7.0"
radon = ">=6.0.0"
vulture = ">=2.9.0"
pyyaml = ">=6.0.0"
ruff = ">=0.11.6"
types-pyyaml = "*"
pip-audit = ">=2.6.0"
cyclonedx-python-lib = ">=3.0.0"
spdx-tools = ">=0.8.0"

[tool.pixi.pypi-dependencies]
# Essential PyPI-only packages
aider-mcp-server = { path = ".", editable = true }
# Aider dependencies not available on conda-forge or causing conflicts
oslex = "*"
configargparse = "*"
beautifulsoup4 = "*"
json5 = "*"
# Note: aider-chat has complex dependency conflicts, install separately if needed

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]
install-editable = "python -m pip install -e . || (echo '::error::Editable installation failed' && exit 1)"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
typecheck = "mypy src"
test = { cmd = "pip install aider-chat --no-deps && python -m pytest tests -x || (echo '::error::Pytest failed, check dependencies and import paths' && exit 1)", depends-on = ["install-editable"] }
test-cov = { cmd = "pip install aider-chat --no-deps && python -m pytest --cov=src/aider_mcp_server --cov-report=term-missing --cov-report=xml tests -x || (echo '::error::Pytest with coverage failed' && exit 1)", depends-on = ["install-editable"] }
build = { cmd = "python -m build", depends-on = ["install-editable"] }
clean = "rm -rf dist build .ruff_cache .mypy_cache .pytest_cache *.egg-info src/aider_mcp_server.egg-info"
setup-pre-commit = "pre-commit install --install-hooks"
check-all = { depends-on = ["lint", "typecheck", "test"] }
mcp-server = { cmd = "pip install aider-chat --no-deps && python -m aider_mcp_server", env = { PYTHONPATH = "src" }, depends-on = ["install-editable"] }
