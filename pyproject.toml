[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "aider-mcp-server"
version = "0.1.0"
description = "Aider MCP Server - Offload AI coding tasks to Aider"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
[[project.authors]]
name = "Aider Team"

[project.license]
text = "MIT"

[project.scripts]
mcp-aider-server = "aider_mcp_server:main"
mcp-aider = "aider_mcp_server:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
skip = [ "src/aider_mcp_server/stubs/sse_starlette.pyi",]

[tool.mypy]
python_version = "3.12"
packages = [ "aider_mcp_server",]
package_root = [ "src",]
namespace_packages = true
explicit_package_bases = true
plugins = [ "pydantic.mypy",]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.server.stdio"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.types"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aider.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sse_starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aider_mcp_server.server"
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.app"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.multi_transport_server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "aider_mcp_server.atoms.utils.safety_configuration"
disable_error_code = "no-any-return"

[[tool.mypy.overrides]]
module = "aider_mcp_server.molecules.configuration.configuration_manager"
disable_error_code = "no-any-return"

[tool.ruff.lint]
select = [ "E", "F", "A", "B", "C", "Q", "S",]
ignore = [ "E501",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = "test_*.py"
pythonpath = [ "src",]
asyncio_default_fixture_loop_scope = "function"
markers = [ "api: marks tests that require API keys", "integration: marks tests that perform integration testing",]

[tool.pixi.project]
channels = [ "conda-forge",]
platforms = [ "linux-64", "win-64",]

[tool.pixi.dependencies]
python = ">=3.12"
fastapi = ">=0.115.0"
mcp = ">=1.9.1"
pyjwt = ">=2.8.0"
python-dotenv = ">=1.0.0"
sse-starlette = ">=2.0.0"
starlette = ">=0.38.0"
uvicorn = ">=0.30.0"
httpx = ">=0.27.0"
toml = ">=0.10.2"
git = "*"
hatchling = ">=1.18.0"
python-build = "*"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.10.0"
pytest-benchmark = "*"
pytest-timeout = "*"
pytest-xdist = "*"
pytest-json-report = ">=1.5.0"
isort = "*"
mkdocs = "*"
mypy = ">=1.15.0"
pre-commit = "*"
pre-commit-hooks = "*"
safety = ">=3.0.0"
bandit = ">=1.7.0"
radon = ">=6.0.0"
vulture = ">=2.9.0"
ruff = ">=0.11.6"
types-pyyaml = "*"
pip-audit = ">=2.6.0"
cyclonedx-python-lib = ">=3.0.0"
spdx-tools = ">=0.8.0"
aiohttp = "*"
aiosignal = "*"
backoff = "*"
beautifulsoup4 = "*"
certifi = "*"
configargparse = "*"
diff-match-patch = "*"
diskcache = "*"
flake8 = "*"
frozenlist = "*"
gitdb = "*"
gitpython = "*"
google-ai-generativelanguage = "*"
google-api-core = "*"
google-api-python-client = "*"
google-auth = "*"
google-auth-httplib2 = "*"
google-generativeai = "*"
googleapis-common-protos = "*"
grep-ast = "*"
grpcio = "*"
grpcio-status = "*"
importlib-metadata = "<8.0.0"
importlib-resources = "*"
json5 = "*"
jsonschema = "*"
mccabe = "*"
mixpanel = "*"
multidict = "*"
networkx = "*"
numpy = "*"
openai = "*"
packaging = "*"
pathspec = "*"
pexpect = "*"
pillow = "*"
posthog = "*"
prompt_toolkit = "*"
protobuf = "*"
psutil = "*"
pydub = "*"
pycodestyle = "*"
pydantic = "*"
pydantic-core = "*"
pyflakes = "*"
pypandoc = "*"
pyperclip = "*"
pysoundfile = "*"
python-sounddevice = "*"
pyyaml = "*"
rich = "*"
rpds-py = "*"
scipy = "*"
shtab = "*"
smmap = "*"
socksio = "*"
soupsieve = "*"
tokenizers = "*"
tree-sitter-c-sharp = "*"
tree-sitter-embedded-template = "*"
tree-sitter-language-pack = "*"
tree-sitter-yaml = "*"
typing-extensions = "*"
watchfiles = "*"

[tool.pixi.tasks]
install-editable = "python -m pip install -e . || (echo '::error::Editable installation failed' && exit 1)"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
typecheck = "mypy src"
clean = "rm -rf dist build .ruff_cache .mypy_cache .pytest_cache *.egg-info src/aider_mcp_server.egg-info"
setup-pre-commit = "pre-commit install --install-hooks"
sync-aider-deps = "python scripts/sync_aider_deps.py"
remove-aider-deps = "python scripts/sync_aider_deps.py --remove"

[tool.pixi.pypi-dependencies]
oslex = "*"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101", "S105", "S106", "S608",]
"test_*.py" = [ "S101", "S105", "S106", "S108", "S608",]
"src/aider_mcp_server/stubs/sse_starlette.pyi" = [ "E", "F", "I", "A", "B", "C", "Q", "S",]
"src/aider_mcp_server/atoms/tools/aider_ai_code.py" = [ "C901",]
"src/aider_mcp_server/atoms/tools/changes_summarizer.py" = [ "C901",]

[tool.pixi.tasks.test]
cmd = "pip install aider-chat --no-deps && python -m pytest tests -x || (echo '::error::Pytest failed, check dependencies and import paths' && exit 1)"
depends-on = [ "install-editable",]

[tool.pixi.tasks.test-cov]
cmd = "pip install aider-chat --no-deps && python -m pytest --cov=src/aider_mcp_server --cov-report=term-missing --cov-report=xml tests -x || (echo '::error::Pytest with coverage failed' && exit 1)"
depends-on = [ "install-editable",]

[tool.pixi.tasks.build]
cmd = "python -m build"
depends-on = [ "install-editable",]

[tool.pixi.tasks.check-all]
depends-on = [ "lint", "typecheck", "test",]

[tool.pixi.tasks.mcp-server]
cmd = "pip install aider-chat --no-deps && python -m aider_mcp_server"
depends-on = [ "install-editable",]

[tool.pixi.pypi-dependencies.aider-mcp-server]
path = "."
editable = true

[tool.pixi.environments.default]
solve-group = "default"

[tool.pixi.tasks.mcp-server.env]
PYTHONPATH = "src"
