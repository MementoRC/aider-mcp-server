# Systematic Maintenance Configuration
# Aider MCP Server - Phase 1 Implementation

project:
  name: "aider-mcp-server"
  type: "python-backend"
  criticality: "high"  # Critical MCP server component
  repository: "aider-mcp-server"

# Health monitoring thresholds
health_thresholds:
  overall_score: 85                    # Higher threshold for critical MCP server
  security_vulnerabilities: 0          # Zero tolerance for security issues
  dependency_staleness_days: 60        # Faster updates for active project
  performance_regression: 0.10         # 10% performance degradation threshold
  code_coverage_minimum: 80            # Maintain high test coverage
  complexity_threshold: 10             # Maximum cyclomatic complexity
  technical_debt_ratio: 0.05           # 5% technical debt ratio limit

# Automation levels for different maintenance categories
automation_levels:
  dependencies:
    patch_updates: "auto"              # Automatically apply patch updates
    minor_updates: "semi-auto"         # Create PR for minor updates
    major_updates: "manual"            # Human review required for major updates
    security_patches: "auto"           # Auto-apply security patches immediately

  code_quality:
    formatting: "auto"                 # Auto-format on every commit (already implemented)
    linting_fixes: "auto"              # Auto-fix linting issues (already implemented)
    complexity_refactor: "manual"      # Manual review for complexity improvements
    dead_code_removal: "semi-auto"     # Create PR for dead code cleanup

  security:
    vulnerability_scanning: "auto"     # Daily automated scanning
    patch_application: "auto"          # Auto-apply security patches
    dependency_updates: "auto"         # Auto-update vulnerable dependencies
    code_analysis: "auto"              # Automated security code analysis

  documentation:
    api_docs: "auto"                   # Auto-generate API docs (already implemented)
    readme_updates: "semi-auto"        # Create PR for README improvements
    changelog: "manual"                # Manual changelog management

  testing:
    coverage_monitoring: "auto"        # Continuous coverage monitoring
    performance_benchmarks: "auto"     # Automated performance testing
    compatibility_testing: "auto"      # Already implemented for aider versions

# Maintenance scheduling configuration
maintenance_schedule:
  trigger_type: "health_based"         # Health-based triggers vs calendar-based
  health_check_frequency: "daily"     # Daily health assessments
  full_maintenance_review: "monthly"  # Comprehensive monthly review

  # Emergency triggers that require immediate attention
  emergency_triggers:
    - "critical_security_vulnerability"
    - "performance_degradation > 20%"
    - "test_failure_rate > 5%"
    - "memory_leak_detected"
    - "dependency_conflict"

  # Scheduled maintenance windows
  maintenance_windows:
    daily_window: "06:00-07:00 UTC"   # Daily maintenance window
    weekly_window: "Sunday 02:00-04:00 UTC"  # Weekly deep maintenance

# Integration with existing monitoring systems
existing_systems:
  health_monitor: "src/aider_mcp_server/molecules/monitoring/health_monitor.py"
  metrics_collector: "src/aider_mcp_server/molecules/monitoring/metrics_collector.py"
  health_tracker: "src/aider_mcp_server/molecules/monitoring/health_tracker.py"
  audit_analytics: "src/aider_mcp_server/molecules/monitoring/audit_analytics.py"

# Quality gates that must pass before proceeding
quality_gates:
  required_checks:
    - "all_tests_pass"
    - "zero_critical_lint_violations"
    - "security_scan_clean"
    - "performance_within_thresholds"
    - "coverage_above_minimum"

  blocking_conditions:
    - "critical_security_vulnerability"
    - "major_performance_regression"
    - "test_coverage_drop > 5%"

# Notification configuration
notifications:
  github_issues: true                  # Create GitHub issues for maintenance tasks
  pr_comments: true                    # Comment on PRs with maintenance updates
  workflow_summaries: true             # Generate workflow summary reports

  # Labels for categorizing maintenance issues
  issue_labels:
    security: ["security", "automated", "maintenance"]
    performance: ["performance", "automated", "maintenance"]
    dependencies: ["dependencies", "automated", "maintenance"]
    quality: ["code-quality", "automated", "maintenance"]

# Project-specific maintenance tasks
project_specific:
  aider_compatibility:
    versions_to_test: ["0.83.0", "0.83.1", "latest"]
    compatibility_check_frequency: "weekly"
    auto_update_compatibility_matrix: true

  atomic_design_validation:
    check_layer_separation: true
    validate_interface_contracts: true
    monitor_dependency_direction: true

  mcp_server_health:
    transport_monitoring: ["stdio", "http", "sse"]
    client_compatibility_testing: true
    performance_benchmarking: true

# Maintenance history tracking
tracking:
  maintenance_history_file: ".maintenance_history.json"
  track_effectiveness: true
  generate_maintenance_reports: true
  maintenance_metrics_retention_days: 365

# Phase 1 specific configuration
phase1_config:
  implementation_date: "2025-06-14"
  target_completion: "2025-07-14"
  focus_areas:
    - "security_scanning_automation"
    - "health_scoring_integration"
    - "maintenance_orchestration"
    - "systematic_scheduling"

  success_metrics:
    - "daily_health_monitoring_active"
    - "security_scanning_automated"
    - "maintenance_issues_auto_created"
    - "health_score_tracking_implemented"
