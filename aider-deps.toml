# Aider Dependencies Configuration
# This file contains all conda-forge and PyPI dependencies needed by aider-chat
# when using --no-deps installation approach.
# 
# TODO: Remove this file when aider-chat becomes available as a conda-forge package

[conda-dependencies]
# Dependencies available on conda-forge
aiohttp = "3.12.13"
aiosignal = "1.3.2" 
backoff = "*"
beautifulsoup4 = "4.13.4"
certifi = "2025.6.15"
configargparse = "*"
diff-match-patch = "*"
diskcache = "*"
flake8 = "*"
frozenlist = "1.7.0"
gitdb = "*"
gitpython = "*"
google-ai-generativelanguage = "*"
google-api-core = "*"
google-api-python-client = "2.174.0"
google-auth = "2.40.3"
google-auth-httplib2 = "*"
google-generativeai = "*"
googleapis-common-protos = "*"
grep-ast = "0.9.0"
grpcio = "*"
grpcio-status = "*"
importlib-metadata = "<8.0.0"
importlib-resources = "*"
json5 = "*"
jsonschema = "*"
litellm = "1.73.1"
mccabe = "*"
mixpanel = "*"
multidict = "6.5.1"
networkx = "3.4.2"
numpy = "1.26.4"
openai = "1.91.0"
packaging = "25.0"
pathspec = "*"
pexpect = "*"
pillow = "11.2.1"
posthog = "5.4.0"
prompt_toolkit = "3.0.51"
protobuf = "*"
psutil = "*"
pydub = "*"
pycodestyle = "*"
pydantic = "*"
pydantic-core = "*"
pyflakes = "*"
pypandoc = "*"
pyperclip = "*"
pysoundfile = "*"
python-sounddevice = "*"
pyyaml = "*"
rich = "*"
rpds-py = "0.25.1"
scipy = "*"
shtab = "*"
smmap = "*"
socksio = "*"
soupsieve = "*"
tokenizers = "0.21.2"
tree-sitter-c-sharp = "*"
tree-sitter-embedded-template = "*"
tree-sitter-language-pack = "0.8.0"
tree-sitter-yaml = "0.7.1"
typing-extensions = "4.14.0"
watchfiles = "*"

[pypi-dependencies]
# Dependencies only available on PyPI
oslex = "*"

[notes]
strategy = "Use --no-deps with aider-chat and provide explicit dependencies"
removal-trigger = "When aider-chat becomes available on conda-forge"