configargparse = "*"
diff-match-patch = "*"
diskcache = "*"
flake8 = "*"
frozenlist = "*"
gitdb = "*"
gitpython = "*"
google-ai-generativelanguage = "*"
google-api-core = "*"
google-api-python-client = "*"
google-auth = "*"
google-auth-httplib2 = "*"
google-generativeai = "*"
googleapis-common-protos = "*"
grep-ast = "*"
grpcio = "*"
grpcio-status = "*"
importlib-metadata = "<8.0.0"
importlib-resources = "*"
json5 = "*"
jsonschema = "*"
litellm = "*"
mccabe = "*"
mixpanel = "*"
multidict = "*"
networkx = "*"
numpy = "*"
openai = "*"
packaging = "*"
pathspec = "*"
pexpect = "*"
pillow = "*"
posthog = "*"
prompt_toolkit = "*"
protobuf = "*"
psutil = "*"
pydub = "*"
pycodestyle = "*"
pydantic = "*"
pydantic-core = "*"
pyflakes = "*"
pypandoc = "*"
pyperclip = "*"
pysoundfile = "*"
python-sounddevice = "*"
pyyaml = "*"
rich = "*"
rpds-py = "*"
