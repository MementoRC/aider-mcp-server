name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Quick Validation (Fast Feedback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.20.1
      - name: Fast linting check
        run: pixi run ci-check
      - name: Fast unit tests (no coverage)
        run: pixi run -e default pytest tests -x -q --no-cov -m "not integration and not benchmark" || true

  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Install pre-commit hooks
        run: hatch -e dev run pre-commit install --install-hooks

      - name: Run pre-commit
        run: |
          hatch -e dev run pre-commit run --all-files
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.10"]
        exclude:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
        include:
          - os: windows-latest
            python-version: "3.10"
            timeout: 25
          - os: windows-latest
            python-version: "3.12"
            timeout: 20
          - os: ubuntu-latest
            python-version: "3.12"
            timeout: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Windows-specific environment setup
        if: runner.os == 'Windows'
        run: |
          echo "PYTEST_ADDOPTS=--maxfail=2 --timeout=900 --durations=10" >> $GITHUB_ENV
          echo "SKIP_SLOW_TESTS=1" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # On Windows, run with reduced parallelism and skip slow/integration/benchmark tests
            hatch -e test run pytest --cov=src --cov-report=xml -m "not integration and not benchmark and not slow" --maxfail=2 --timeout=900 --durations=10
          else
            hatch -e test run pytest --cov=src --cov-report=xml
          fi
        shell: bash

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12']
        aider-version: ['0.83.0', '0.83.1', 'latest']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock pytest-timeout
          pip install -e .

      - name: Install specific aider version
        run: |
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            pip install aider-chat
          else
            pip install aider-chat==${{ matrix.aider-version }}
          fi

      - name: Run compatibility check script
        run: |
          python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          python -c "import aider; print(f'Testing with aider version: {aider.__version__}')"

      - name: Run compatibility tests
        run: |
          pytest tests/compatibility/ -v

      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
