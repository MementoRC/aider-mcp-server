name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HATCH_ENV_ROOT: .hatch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-dev-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/.pre-commit-config.yaml', '**/uv.lock') }}
          restore-keys: |
            hatch-dev-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create dev

      - name: Clean pre-commit cache
        run: |
          hatch run dev:pre-commit clean || true
          rm -rf ~/.cache/pre-commit || true

      - name: Configure git for consistency
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Run all pre-commit hooks
        run: |
          echo "Running all pre-commit hooks (formatters, linters, and mypy)..."
          hatch run dev:pre-commit install --install-hooks
          hatch run dev:pre-commit run --all-files

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      HATCH_ENV_ROOT: .hatch
      # Provide mock API keys to allow integration tests to run without real secrets
      OPENAI_API_KEY: "sk-mock-openai-key"
      ANTHROPIC_API_KEY: "sk-mock-anthropic-key"
      GOOGLE_API_KEY: "mock-google-key"
      GEMINI_API_KEY: "mock-gemini-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-test-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            hatch-test-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create test

      - name: Show hatch environment
        shell: bash
        run: |
          echo ">>> Hatch environment details"
          hatch env show test
          echo ">>> Installed packages in hatch environment"
          hatch run test:pip list

      - name: Check system resources (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::System resources on ${{ runner.os }}"
          echo ">>> Disk space"
          df -h
          echo ">>> Memory usage"
          free -h
          echo ">>> CPU info"
          lscpu
          echo "::endgroup::"

      - name: Check system resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "::group::System resources on ${{ runner.os }}"
          echo ">>> Disk space"
          Get-PSDrive -PSProvider FileSystem
          echo ">>> Memory usage"
          Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          echo ">>> CPU info"
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          echo "::endgroup::"

      - name: Debug environment variables (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::Environment variables"
          env | sort
          echo "::endgroup::"

      - name: Debug environment variables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "::group::Environment variables"
          Get-ChildItem Env: | Sort-Object Name
          echo "::endgroup::"

      - name: Run tests
        shell: bash
        run: |
          hatch run test:test -vv --durations=10 --cov=src --cov-report=xml

      - name: Upload coverage report
        if: success() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        aider-version: ['0.83.0', '0.83.1', 'latest']
    env:
      HATCH_ENV_ROOT: .hatch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-test-${{ runner.os }}-${{ matrix.aider-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            hatch-test-${{ runner.os }}-${{ matrix.aider-version }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create test

      - name: Install specific aider version
        run: |
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            hatch run test:pip install aider-chat
          else
            hatch run test:pip install aider-chat==${{ matrix.aider-version }}
          fi

      - name: Show hatch environment
        shell: bash
        run: |
          echo ">>> Hatch environment details"
          hatch env show test
          echo ">>> Installed packages in hatch environment"
          hatch run test:pip list

      - name: Run compatibility check script
        run: |
          hatch run test:python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          hatch run test:python -c "import aider; print('Testing with aider version: ' + aider.__version__)"

      - name: Run compatibility tests
        run: |
          hatch run test:test tests/compatibility/ -v

      - name: Run integration tests
        run: |
          hatch run test:test tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
