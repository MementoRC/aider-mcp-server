name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        run: |
          pixi install

      - name: Run all pre-commit hooks
        run: |
          echo "Running all pre-commit hooks (formatters, linters, and mypy)..."
          pixi run setup-pre-commit
          pixi run pre-commit run --all-files

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Provide mock API keys to allow integration tests to run without real secrets
      OPENAI_API_KEY: "sk-mock-openai-key"
      ANTHROPIC_API_KEY: "sk-mock-anthropic-key"
      GOOGLE_API_KEY: "mock-google-key"
      GEMINI_API_KEY: "mock-gemini-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          echo ">>> Installing pixi environment"
          pixi install --verbose
          echo ">>> Installing aider-chat"
          pixi run python -m pip install aider-chat --verbose

      - name: Show pixi environment
        shell: bash
        run: |
          echo ">>> Pixi environment details"
          pixi info
          echo ">>> Installed packages in pixi environment"
          pixi run pip list

      - name: Check system resources (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::System resources on ${{ runner.os }}"
          echo ">>> Disk space"
          df -h
          echo ">>> Memory usage"
          free -h
          echo ">>> CPU info"
          lscpu
          echo "::endgroup::"

      - name: Check system resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "::group::System resources on ${{ runner.os }}"
          echo ">>> Disk space"
          Get-PSDrive -PSProvider FileSystem
          echo ">>> Memory usage"
          Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          echo ">>> CPU info"
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          echo "::endgroup::"

      - name: Debug environment variables (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::Environment variables"
          env | sort
          echo "::endgroup::"

      - name: Debug environment variables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "::group::Environment variables"
          Get-ChildItem Env: | Sort-Object Name
          echo "::endgroup::"

      - name: Run tests
        shell: bash
        run: |
          pixi run test-cov

      - name: Upload coverage report
        if: success() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        aider-version: ['0.83.0', '0.83.1', 'latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        run: |
          pixi install

      - name: Install specific aider version
        run: |
          echo "Installing aider-chat version: ${{ matrix.aider-version }}"
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            pixi run python -m pip install aider-chat --verbose
          else
            pixi run python -m pip install aider-chat==${{ matrix.aider-version }} --verbose
          fi
          echo "Verifying aider installation..."
          pixi run python -c "import aider; print('Successfully installed aider')" || echo "Warning: aider import failed, but continuing..."

      - name: Show pixi environment
        shell: bash
        run: |
          echo ">>> Pixi environment details"
          pixi info
          echo ">>> Installed packages in pixi environment"
          pixi run pip list

      - name: Run compatibility check script
        run: |
          pixi run python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          pixi run python -c 'import aider; print("Testing with aider version: " + aider.__version__)'

      - name: Run compatibility tests
        run: |
          pixi run python -m pytest tests/compatibility/ -v

      - name: Run integration tests
        run: |
          pixi run python -m pytest tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
