name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install uv and sync dependencies
        run: |
          pip install uv
          uv sync --dev

      - name: Run all pre-commit hooks
        run: |
          echo "Running all pre-commit hooks (formatters, linters, and mypy)..."
          uv run pre-commit install
          uv run pre-commit run --all-files

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install uv and sync dependencies
        run: |
          pip install uv
          uv sync --dev

      - name: Run tests with coverage
        shell: bash
        run: |
          uv run pytest --cov=src --cov=strategy_sandbox --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        aider-version: ['0.83.0', '0.83.1', 'latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .uv
          key: uv-${{ runner.os }}-${{ matrix.aider-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.aider-version }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install uv and sync dependencies
        run: |
          pip install uv
          uv sync --dev

      - name: Install specific aider version
        run: |
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            uv pip install aider-chat
          else
            uv pip install aider-chat==${{ matrix.aider-version }}
          fi

      - name: Run compatibility check script
        run: |
          uv run python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          uv run python -c "import aider; print('Testing with aider version: ' + aider.__version__)"

      - name: Run compatibility tests
        run: |
          uv run pytest tests/compatibility/ -v

      - name: Run integration tests
        run: |
          uv run pytest tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
