name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: prefix-dev/pixi-action@v0.5.0
        with:
          cache: true

      - name: Install pre-commit hooks
        run: pixi run pre-commit install --install-hooks

      - name: Run formatters and basic linters
        run: |
          echo "Running formatters and basic linters..."
          SKIP=mypy pixi run pre-commit run --all-files

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

      - name: Run mypy for type checking
        run: |
          echo "Running mypy for type checking..."
          pixi run pre-commit run mypy --all-files

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: prefix-dev/pixi-action@v0.5.0
        with:
          cache: true

      - name: Run tests with coverage
        run: |
          pixi run pytest --cov=src --cov=strategy_sandbox --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        aider-version: ['0.83.0', '0.83.1', 'latest']

    steps:
      - uses: actions/checkout@v3

      - uses: prefix-dev/pixi-action@v0.5.0
        with:
          cache: true

      - name: Install specific aider version
        run: |
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            pixi run pip install aider-chat
          else
            pixi run pip install aider-chat==${{ matrix.aider-version }}
          fi

      - name: Run compatibility check script
        run: |
          pixi run python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          pixi run python -c "import aider; print(f'Testing with aider version: {aider.__version__}')"

      - name: Run compatibility tests
        run: |
          pixi run pytest tests/compatibility/ -v

      - name: Run integration tests
        run: |
          pixi run pytest tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
