name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HATCH_ENV_ROOT: .hatch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/hatch.lock') }}
          restore-keys: |
            hatch-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create dev

      - name: Run all pre-commit hooks
        run: |
          echo "Running all pre-commit hooks (formatters, linters, and mypy)..."
          hatch run dev:pre-commit install
          hatch run dev:pre-commit run --all-files

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run formatters locally before pushing."
            git diff
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HATCH_ENV_ROOT: .hatch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/hatch.lock') }}
          restore-keys: |
            hatch-${{ runner.os }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create dev

      - name: Show hatch environment
        shell: bash
        run: |
          echo ">>> Hatch environment details"
          hatch env show dev
          echo ">>> Installed packages in hatch environment"
          hatch run dev:pip list

      - name: Check system resources
        shell: bash
        run: |
          echo "::group::System resources on ${{ runner.os }}"
          echo ">>> Disk space"
          df -h
          echo ">>> Memory usage"
          free -h
          echo ">>> CPU info"
          lscpu
          echo "::endgroup::"

      - name: Debug environment variables
        shell: bash
        run: |
          echo "::group::Environment variables"
          env | sort
          echo "::endgroup::"

      - name: Run tests
        id: run_tests
        shell: bash
        run: |
          echo "::group::Attempting to run tests with coverage"
          set +e
          hatch run dev:test -vv -m "not integration" --durations=10 --cov=src --cov-report=xml
          exit_code=$?
          set -e
          echo "::endgroup::"
          if [ $exit_code -ne 0 ]; then
            echo "::warning::Tests with coverage failed with exit code $exit_code. Retrying without coverage."
            echo "coverage_failed=true" >> $GITHUB_OUTPUT
            echo "::group::Attempting to run tests without coverage"
            hatch run dev:test -vv -m "not integration" --durations=10
            exit_code_no_cov=$?
            echo "::endgroup::"
            if [ $exit_code_no_cov -ne 0 ]; then
              echo "::error::Tests failed even without coverage."
              exit $exit_code_no_cov
            else
              echo "Tests passed without coverage. Coverage report will be missing."
            fi
          else
            echo "Tests with coverage passed."
            echo "coverage_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage report
        if: steps.run_tests.outputs.coverage_failed == 'false' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        aider-version: ['0.83.0', '0.83.1', 'latest']
    env:
      HATCH_ENV_ROOT: .hatch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache hatch environment
        uses: actions/cache@v4
        with:
          path: .hatch
          key: hatch-${{ runner.os }}-${{ matrix.aider-version }}-${{ hashFiles('**/pyproject.toml', '**/hatch.lock') }}
          restore-keys: |
            hatch-${{ runner.os }}-${{ matrix.aider-version }}-
        continue-on-error: true # Don't fail workflow if cache service is unavailable

      - name: Install hatch and dependencies
        run: |
          pip install hatch
          hatch env create dev

      - name: Install specific aider version
        run: |
          if [ "${{ matrix.aider-version }}" = "latest" ]; then
            hatch run dev:pip install aider-chat
          else
            hatch run dev:pip install aider-chat==${{ matrix.aider-version }}
          fi

      - name: Show hatch environment
        shell: bash
        run: |
          echo ">>> Hatch environment details"
          hatch env show dev
          echo ">>> Installed packages in hatch environment"
          hatch run dev:pip list

      - name: Run compatibility check script
        run: |
          hatch run dev:python scripts/inspect_aider_params.py

      - name: Display aider version
        run: |
          hatch run dev:python -c "import aider; print('Testing with aider version: ' + aider.__version__)"

      - name: Run compatibility tests
        run: |
          hatch run dev:test tests/compatibility/ -v

      - name: Run integration tests
        run: |
          hatch run dev:test tests/ -v -m integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
