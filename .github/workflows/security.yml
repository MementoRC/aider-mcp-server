name: Security Scanning

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        run: |
          pixi install

      - name: Create reports directory
        run: mkdir -p reports

      - name: Dependency vulnerability scan
        run: |
          echo "Scanning dependencies for vulnerabilities..."
          pixi run pip-audit --desc --output=json --cache-dir=.pip-audit-cache > reports/pip-audit.json || true
          pixi run pip-audit --desc --output=text > reports/pip-audit.txt || true

          # Also scan with safety
          pixi run safety check --json > reports/safety-scan.json || true
          pixi run safety check > reports/safety-scan.txt || true

      - name: Security linting with bandit
        run: |
          echo "Running security linting..."
          pixi run bandit -r src/ -f json -o reports/bandit-scan.json || true
          pixi run bandit -r src/ -f txt -o reports/bandit-scan.txt || true

      - name: Process security scan results
        id: process-results
        run: |
          echo "Processing security scan results..."

          # Debug: show file sizes and contents if empty
          for f in reports/pip-audit.json reports/safety-scan.json; do
            if [ ! -s "$f" ]; then
              echo "::warning file=$f::File is empty or missing!"
              echo "{}" > "$f"
            fi
            echo "File: $f"
            ls -l "$f"
            head -20 "$f"
          done

          # Count vulnerabilities from pip-audit (handle empty or invalid JSON)
          VULN_COUNT=$(jq '.vulnerabilities | length' reports/pip-audit.json 2>/dev/null)
          if ! [[ "$VULN_COUNT" =~ ^[0-9]+$ ]]; then
            VULN_COUNT=0
          fi

          # Count high/critical issues from bandit (handle empty or invalid JSON)
          BANDIT_HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' reports/bandit-scan.json 2>/dev/null)
          if ! [[ "$BANDIT_HIGH" =~ ^[0-9]+$ ]]; then
            BANDIT_HIGH=0
          fi

          # Count safety issues (handle empty or invalid JSON)
          SAFETY_COUNT=$(jq 'length' reports/safety-scan.json 2>/dev/null)
          if ! [[ "$SAFETY_COUNT" =~ ^[0-9]+$ ]]; then
            SAFETY_COUNT=0
          fi

          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "bandit_high=$BANDIT_HIGH" >> $GITHUB_OUTPUT
          echo "safety_issues=$SAFETY_COUNT" >> $GITHUB_OUTPUT

          TOTAL_ISSUES=$((VULN_COUNT + BANDIT_HIGH + SAFETY_COUNT))
          echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT

          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "**Dependency Vulnerabilities:** $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**High/Critical Security Issues:** $BANDIT_HIGH" >> $GITHUB_STEP_SUMMARY
          echo "**Safety Database Issues:** $SAFETY_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Total Security Issues:** $TOTAL_ISSUES" >> $GITHUB_STEP_SUMMARY

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Fail on critical security issues
        if: steps.process-results.outputs.bandit_high > 0 || steps.process-results.outputs.vulnerabilities > 5
        run: |
          echo "Critical security issues found!"
          echo "High/Critical bandit issues: ${{ steps.process-results.outputs.bandit_high }}"
          echo "Vulnerabilities: ${{ steps.process-results.outputs.vulnerabilities }}"
          exit 1
