name: Advanced CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.49.0
          cache: true
          activate-environment: true

      - name: Install dependencies (quality-extended environment)
        run: |
          pixi install -e quality-extended

      - name: Create reports directory
        run: mkdir -p reports/quality

      - name: Run complexity analysis with radon
        run: |
          echo "Running complexity analysis with radon..."
          pixi run -e quality-extended radon mi src/ -j > reports/quality/radon-mi.txt
          pixi run -e quality-extended radon cc src/ -a -s -j > reports/quality/radon-cc.json || true
          pixi run -e quality-extended radon cc src/ -a -s > reports/quality/radon-cc.txt || true

      - name: Run dead code detection with vulture
        run: |
          echo "Running dead code detection with vulture..."
          pixi run -e quality-extended vulture src/ --min-confidence 80 > reports/quality/vulture.txt || true

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: reports/quality/
          retention-days: 30

  sbom-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.49.0
          cache: true
          activate-environment: true

      - name: Install dependencies (quality-extended environment)
        run: |
          pixi install -e quality-extended

      - name: Create reports directory
        run: mkdir -p reports/sbom

      - name: Generate requirements.txt for SBOM
        run: |
          echo "Generating requirements.txt for SBOM tools..."
          pixi run -e quality-extended pip freeze > reports/sbom/requirements.txt

      - name: Generate CycloneDX SBOM
        continue-on-error: true
        run: |
          echo "Generating CycloneDX SBOM..."
          pixi run -e quality-extended cyclonedx-py -r reports/sbom/requirements.txt --format json -o reports/sbom/bom.cyclonedx.json

      - name: Generate SPDX SBOM
        continue-on-error: true
        run: |
          echo "Generating SPDX SBOM..."
          pixi run -e quality-extended spdx-tools-python -p . -r reports/sbom/requirements.txt --file-format JSON -o reports/sbom/bom.spdx.json

      - name: Upload SBOM reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports-${{ github.run_number }}
          path: reports/sbom/
          retention-days: 30
