name: Deploy Documentation

on:
  push:
    branches:
      - development  # Deploy docs when pushing to development branch
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual deployment

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper git info in docs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
            ${{ runner.os }}-pip-

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs[i18n]>=1.5.0
          pip install mkdocs-material>=9.0.0
          pip install mkdocstrings[python]>=0.20.0
          pip install pymdown-extensions>=10.0.0

      - name: Verify MkDocs installation
        run: |
          mkdocs --version
          python -c "import mkdocs; print(f'MkDocs version: {mkdocs.__version__}')"

      - name: Build MkDocs site
        run: |
          mkdocs build --clean --strict
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify on success/failure
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Documentation successfully deployed to GitHub Pages"
            echo "📖 Site URL: https://mementorc.github.io/aider-mcp-server/"
          else
            echo "❌ Documentation deployment failed"
            echo "Build status: ${{ needs.build.result }}"
            echo "Deploy status: ${{ needs.deploy.result }}"
          fi
